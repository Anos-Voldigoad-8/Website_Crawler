[project]
name = "spiderweb"
version = "0.1.0"
description = "Async website crawler with a live cyberpunk visualization"
requires-python = ">=3.11"
authors = [{ name = "Anos-Voldigoad-8" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.12.0",
    "selectolax>=0.3.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.5.0",
]

[project.scripts]
spiderweb = "spiderweb.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
